<style>
/* Layout: one calm screen. Large title area, one focal object, actions anchored at the bottom.
   Feedback arrives as a frosted sheet. Quiet greys, one green tint, amber only for sounds Bangla lacks. */
:root{
  --bg:#F5F5F7; --card:#FFFFFF; --fill:#EDEDF0; --ink:#1D1D1F; --ink-2:#6E6E73; --ink-3:#A1A1A6; --sep:rgba(60,60,67,.12);
  --tint:#0B7A55; --tint-bg:#E3F2EC; --on-tint:#FFFFFF;
  --sound:#A3550A; --sound-bg:#FDF0E1;
  --good:#1E8E3E; --good-bg:#E6F4EA; --bad:#C5221F; --bad-bg:#FCE8E6;
  --sheet:rgba(255,255,255,.82); --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);
  --f-bn:'Noto Sans Bengali',-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;
  --f-ar:'Noto Naskh Arabic','SF Arabic','Geeza Pro',serif;
  --spring:cubic-bezier(.32,.72,0,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --card:#1C1C1E; --fill:#2C2C2E; --ink:#F5F5F7; --ink-2:#98989D; --ink-3:#636366; --sep:rgba(84,84,88,.6);
  --tint:#3DD39B; --tint-bg:#0F3326; --on-tint:#00140D; --sound:#FFB35C; --sound-bg:#3A2610;
  --good:#4CD07D; --good-bg:#0E2E1A; --bad:#FF6B61; --bad-bg:#3A1513; --sheet:rgba(28,28,30,.82); --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1C1C1E; --fill:#2C2C2E; --ink:#F5F5F7; --ink-2:#98989D; --ink-3:#636366; --sep:rgba(84,84,88,.6);
  --tint:#3DD39B; --tint-bg:#0F3326; --on-tint:#00140D; --sound:#FFB35C; --sound-bg:#3A2610;
  --good:#4CD07D; --good-bg:#0E2E1A; --bad:#FF6B61; --bad-bg:#3A1513; --sheet:rgba(28,28,30,.82); --shadow:none; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-bn);font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow:hidden}
.app{position:relative;height:100%;max-width:440px;margin:0 auto;display:flex;flex-direction:column;box-sizing:border-box;
  padding-left:max(20px, env(safe-area-inset-left, 0px));padding-right:max(20px, env(safe-area-inset-right, 0px));padding-block:10px 16px}
.ar{font-family:var(--f-ar);direction:rtl;font-weight:500}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-user-select:none;user-select:none}
button:focus-visible{outline:2px solid var(--tint);outline-offset:3px}

/* navigation bar */
.nav{display:flex;align-items:center;gap:14px;min-height:48px}
.close{width:36px;height:36px;border-radius:50%;background:var(--fill);color:var(--ink-2);display:flex;align-items:center;justify-content:center;flex:none}
.close::after{content:"";position:absolute;width:44px;height:44px}
.bar{flex:1;height:6px;background:var(--fill);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--tint);border-radius:3px;transition:width .6s var(--spring)}
.step{font-size:13px;color:var(--ink-3);min-width:40px;text-align:right;font-variant-numeric:tabular-nums}

/* stage */
.stage{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;justify-content:center;gap:20px;padding-block:8px 16px}
.eyebrow{font-size:13px;font-weight:600;color:var(--ink-2);text-align:center;letter-spacing:.01em}
.title{font-size:30px;font-weight:700;line-height:1.25;letter-spacing:-.01em;text-align:center;margin:0;text-wrap:balance}
.body{font-size:16px;color:var(--ink-2);text-align:center;margin:0;line-height:1.55;text-wrap:pretty}
.hero-bn{font-size:clamp(52px,15vw,68px);font-weight:700;letter-spacing:-.01em;text-align:center;line-height:1.15;transition:font-size .5s var(--spring),color .5s}
.hero-bn.small{font-size:20px;font-weight:600;color:var(--ink-2)}
.hero-ar{font-family:var(--f-ar);direction:rtl;font-size:clamp(64px,19vw,92px);font-weight:500;line-height:1.6;text-align:center}
.write{clip-path:inset(-20% -10% -20% 110%);animation:write 1.1s var(--spring) .25s forwards}
@keyframes write{to{clip-path:inset(-20% -10% -20% -10%)}}
.in{opacity:0;transform:translateY(8px);animation:in .5s var(--spring) forwards}
@keyframes in{to{opacity:1;transform:none}}
.arrow{display:flex;justify-content:center;color:var(--ink-3);margin:-8px 0}

/* pronunciation */
.pron{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:2px;font-size:24px;font-weight:600}
.syl{padding:2px 8px;border-radius:9px;transition:background .18s,color .18s}
.syl.sp{color:var(--sound)}
.syl.on{background:var(--ink);color:var(--bg)}
.syl.sp.on{background:var(--sound);color:var(--card)}
.sep{color:var(--ink-3);font-weight:400}
.hint{font-size:13px;color:var(--ink-3);text-align:center}
.hint b{color:var(--sound);font-weight:600}

/* grouped card */
.group{background:var(--card);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:flex-start;gap:12px;padding:14px 16px}
.row + .row{border-top:.5px solid var(--sep)}
.row .k{font-size:13px;color:var(--ink-2);width:52px;flex:none;padding-top:2px}
.row .v{flex:1;min-width:0;font-size:16px;line-height:1.55}
.row .v .ar{font-size:21px;color:var(--ink)}
.row .v .s{color:var(--sound)}

/* choices */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt{min-height:88px;border-radius:18px;background:var(--card);box-shadow:var(--shadow);font-family:var(--f-ar);font-size:34px;font-weight:500;color:var(--ink);
  display:flex;align-items:center;justify-content:center;transition:transform .2s var(--spring),background .2s,box-shadow .2s,opacity .25s;outline:2px solid transparent;outline-offset:-2px}
.opt:active{transform:scale(.96)}
.opt.bn{font-family:var(--f-bn);font-size:21px;font-weight:600}
.opt.sel{outline-color:var(--tint);background:var(--tint-bg)}
.opt.right{outline-color:var(--good);background:var(--good-bg);color:var(--good)}
.opt.wrong{outline-color:var(--bad);background:var(--bad-bg);color:var(--bad);animation:nope .32s}
.opt.dim{opacity:.4}
.opt.gone{opacity:0;transform:scale(.92);pointer-events:none}
@keyframes nope{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* listen */
.orb{width:120px;height:120px;border-radius:50%;margin:0 auto;background:var(--tint);color:var(--on-tint);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px -10px var(--tint);position:relative;transition:transform .2s var(--spring)}
.orb:active{transform:scale(.95)}
.orb.playing::before{content:"";position:absolute;inset:-8px;border-radius:50%;border:2px solid var(--tint);opacity:.0;animation:halo 1.1s ease-out infinite}
@keyframes halo{0%{opacity:.5;transform:scale(.92)}100%{opacity:0;transform:scale(1.18)}}

/* bottom area */
.dock{display:flex;gap:10px;align-items:center}
.btn{flex:1;min-height:52px;border-radius:14px;background:var(--tint);color:var(--on-tint);font-size:17px;font-weight:600;transition:transform .15s var(--spring),opacity .2s}
.btn:active{transform:scale(.98)}
.btn:disabled{background:var(--fill);color:var(--ink-3)}
.round{width:52px;height:52px;border-radius:14px;background:var(--fill);color:var(--tint);display:flex;align-items:center;justify-content:center;flex:none}
.round.text{width:auto;padding:0 16px;font-size:15px;font-weight:600;gap:6px}

.sheet{position:absolute;left:0;right:0;bottom:0;padding:18px max(20px, env(safe-area-inset-left, 0px)) 16px;box-sizing:border-box;
  background:var(--sheet);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-top:.5px solid var(--sep);border-radius:22px 22px 0 0;transform:translateY(105%);transition:transform .45s var(--spring);display:flex;flex-direction:column;gap:12px;z-index:3}
.sheet.up{transform:none}
.verdict{display:flex;align-items:center;gap:8px;font-size:19px;font-weight:700}
.verdict.ok{color:var(--good)} .verdict.no{color:var(--bad)}
.sheet .line{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sheet .line .ar{font-size:34px}
.sheet .pron{justify-content:flex-start;font-size:20px}
.sheet .say{font-size:15px;color:var(--ink-2)}
.toast{min-height:16px;font-size:12px;color:var(--ink-3);text-align:center;margin:0 0 6px}

/* end */
.big{font-size:96px;font-weight:700;letter-spacing:-.03em;line-height:1;text-align:center;color:var(--tint);font-variant-numeric:tabular-nums}
.list .row{align-items:center}
.list .row .v strong{display:block;font-weight:600}
.list .row .v small{color:var(--ink-2);font-size:13px}
.list .row .ar{font-size:26px}
.mini{width:36px;height:36px;border-radius:50%;background:var(--fill);color:var(--tint);display:flex;align-items:center;justify-content:center;flex:none}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.chip{background:var(--card);box-shadow:var(--shadow);border-radius:999px;padding:6px 14px;display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-2)}
.chip .ar{font-size:20px;color:var(--ink)}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01s!important;animation-delay:0s!important;transition:none!important}.write{clip-path:none}}
</style>
<style>
/* lesson picker and language setting */
.row .k{width:64px}
.seg{display:flex;background:var(--fill);border-radius:10px;padding:3px;gap:2px;flex:none}
.seg button{min-height:38px;min-width:64px;border-radius:8px;font-size:14px;font-weight:600;color:var(--ink-2);transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.home-top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px}
.brand{display:flex;align-items:baseline;gap:8px}
.brand b{font-size:20px;color:var(--tint)}
.brand .ar{font-size:18px;color:var(--ink-2)}
.lessons .row{align-items:center;min-height:64px;box-sizing:border-box;width:100%;text-align:left}
.lessons .num{width:36px;height:36px;border-radius:50%;background:var(--fill);color:var(--ink-2);font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;font-size:15px}
.lessons .num.done{background:var(--tint);color:var(--on-tint)}
.lessons .v strong{display:block;font-weight:600;font-size:16px}
.lessons .v small{color:var(--ink-2);font-size:13px}
.chev{color:var(--ink-3);flex:none}
.dock .round.text{min-width:52px}
</style>

  check:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'
};

/* ---------- audio: ElevenLabs clips (Arabic: Anas, Bangla: Rafiq, English: Alice); device voice as fallback ---------- */
let voices={ar:null,bn:null,en:null}, cur=null;
function loadVoices(){ try{ const v=speechSynthesis.getVoices();
  voices.ar=v.find(x=>/^ar[-_]SA/i.test(x.lang))||v.find(x=>/^ar/i.test(x.lang))||null;
  voices.bn=v.find(x=>/^bn[-_]BD/i.test(x.lang))||v.find(x=>/^bn/i.test(x.lang))||null;
  voices.en=v.find(x=>/^en[-_]GB/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null; }catch(e){} }
try{ loadVoices(); speechSynthesis.onvoiceschanged=loadVoices; }catch(e){}
const cache={};
async function clip(path){ if(path in cache) return cache[path];
  try{ const r=await fetch(path); if(!r.ok) throw 0; cache[path]=URL.createObjectURL(await r.blob()); }catch(e){ cache[path]=null; } return cache[path]; }
function stop(){ try{cur&&cur.pause();}catch(e){} try{speechSynthesis.cancel();}catch(e){} }
// kind: 'ar' (the Arabic word) or 'mean' (meaning line in the app language)
async function play(w,kind,tick){
  stop(); $('toast').textContent='';
  const lang = kind==='ar' ? 'ar' : LANG;
  const src = await clip(`audio/${lang}-${w.id}.mp3`);
  if(src){ const a=new Audio(src); cur=a;
    a.ontimeupdate=()=>tick&&a.duration&&tick(a.currentTime/a.duration); a.onended=()=>tick&&tick(1);
    try{ await a.play(); return; }catch(e){} }
  try{ const text = lang==='ar' ? w.ar : lang==='bn' ? `${w.bn}। অর্থ, ${w.mean.bn}।` : `${w.rom}. ${w.mean.en}.`;
    const u=new SpeechSynthesisUtterance(text);
    u.lang={ar:'ar-SA',bn:'bn-BD',en:'en-GB'}[lang]; u.rate=lang==='ar'?.75:.95; if(voices[lang]) u.voice=voices[lang];
    let t0, raf, est=Math.max(700, syl(w).length*420);
    u.onstart=()=>{ t0=performance.now(); const f=()=>{ const p=(performance.now()-t0)/est; tick&&tick(Math.min(p,.99)); if(p<1) raf=requestAnimationFrame(f); }; f(); };
    u.onend=()=>{ cancelAnimationFrame(raf); tick&&tick(1); };
    speechSynthesis.speak(u);
  }catch(e){ $('toast').textContent=t().noSound; }
}
const karaoke = id => p => { const el=$(id); if(!el) return; const s=el.querySelectorAll('.syl'); const k=p>=1?-1:Math.floor(p*s.length); s.forEach((x,i)=>x.classList.toggle('on',i===k)); };

/* ---------- flow ---------- */
let L, WORDS, S;
function build(){ const s=[];
  for(let g=0;g<WORDS.length/4;g++){ const ids=WORDS.slice(g*4,g*4+4).map(w=>w.id);
    ids.forEach(id=>s.push({t:'intro',id})); shuffle(ids).forEach(id=>s.push({t:'pick',id}));
    s.push({t:'match',ids}); s.push({t:'listen',id:shuffle(ids)[0],ids}); }
  s.push({t:'end'}); return s; }
function open(i, intro){ L=LESSONS[i]; WORDS=L.words; S={steps:(intro?[{t:'start'}]:[]).concat(build()), i:0, first:new Set(WORDS.map(w=>w.id))}; render(); }
function prog(){ const real=S.steps.filter(x=>x.t!=='start'&&x.t!=='end').length, done=S.steps.slice(0,S.i).filter(x=>x.t!=='start').length, k=S.steps[S.i].t;
  $('bar').style.width=(k==='end'?100:done/real*100)+'%'; $('num').textContent=(k==='start'||k==='end')?'':num(done+1)+'/'+num(real); }
function next(){ stop(); sheet(false); S.i++; render(); }
function render(){ $('navbar').style.display=''; $('restart').setAttribute('aria-label', t().back); prog(); $('toast').textContent=''; $('stage').style.justifyContent='';
  const st=S.steps[S.i]; ({start,intro,pick,match,listen,end})[st.t](st); $('stage').scrollTop=0; }
const dock = h => { $('dock').innerHTML=h; };
function sheet(on, html){ const el=$('sheet'); if(html!==undefined) el.innerHTML=html; el.classList.toggle('up',on); }

function home(){
  stop(); sheet(false); S=null; $('navbar').style.display='none'; $('toast').textContent=''; $('stage').style.justifyContent='flex-start';
  $('stage').innerHTML=`
    <div class="home-top in">
      <div class="brand"><b>${t().app}</b><span class="ar" lang="ar">جِسْر</span></div>
      <div class="seg" role="group" aria-label="${t().langLabel}">
        <button data-l="bn" aria-pressed="${LANG==='bn'}">বাংলা</button><button data-l="en" aria-pressed="${LANG==='en'}">English</button>
      </div>
    </div>
    <h1 class="title in" style="text-align:left;margin-top:8px;animation-delay:.04s">${t().home}</h1>
    <p class="body in" style="text-align:left;margin-top:-12px;animation-delay:.06s">${t().homeBody}</p>
    <div class="group lessons in" style="animation-delay:.08s">${LESSONS.map((l,i)=>`
      <button class="row" data-i="${i}"><span class="num${isDone(l.id)?' done':''}">${isDone(l.id)?I.check:num(i+1)}</span>
        <span class="v"><strong>${l.title[LANG]}</strong><small>${t().lesson(num(i+1))} · ${t().words(num(l.words.length))}${isDone(l.id)?' · '+t().done:''}</small></span>${I.chev}</button>`).join('')}</div>
    <p class="hint in" style="animation-delay:.12s">${t().hint}</p>
    <p class="hint in" style="animation-delay:.14s">${t().credit}</p>`;
  document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{ setLang(b.dataset.l); home(); });
  document.querySelectorAll('.lessons .row').forEach(b=>b.onclick=()=>open(+b.dataset.i,true));
  const nextUp = LESSONS.findIndex(l=>!isDone(l.id));
  dock(`<button class="btn" id="go">${t().start} · ${t().lesson(num((nextUp<0?0:nextUp)+1))}</button>`); $('go').onclick=()=>open(nextUp<0?0:nextUp,true);
}

function start(){
  $('stage').innerHTML=`
    <p class="eyebrow in">${t().lesson(num(L.n))}</p>
    <h1 class="title in" style="animation-delay:.05s">${L.title[LANG]}</h1>
    <p class="body in" style="animation-delay:.1s">${L.body[LANG]}</p>
    <div class="chips in" style="animation-delay:.15s">${WORDS.slice(0,6).map(w=>`<span class="chip"><span class="ar" lang="ar">${w.ar}</span>${w.bn}</span>`).join('')}</div>
    <p class="hint in" style="animation-delay:.2s">${t().hint}</p>`;
  dock(`<button class="btn" id="go">${t().start}</button>`); $('go').onclick=next;
}

function intro(st){
  const w=BY[st.id];
  $('stage').innerHTML=`<p class="eyebrow in">${t().youSay}</p><div class="hero-bn in">${w.bn}</div><p class="body in" style="animation-delay:.08s">${t().isArabic}</p>`;
  dock(`<button class="btn" id="rv">${t().seeArabic}</button>`);
  $('rv').onclick=()=>{ tap(8);
    $('stage').innerHTML=`
      <div class="hero-bn small">${w.bn}</div>
      <div class="arrow in" style="animation-delay:.05s">${I.down}</div>
      <div class="hero-ar write" lang="ar">${w.ar}</div>
      <div class="in" style="animation-delay:1.1s">${pron(w,'pr')}</div>
      <div class="group in" style="animation-delay:1.25s">
        <div class="row"><span class="k">${t().kMean}</span><span class="v">${M(w,'mean')}</span></div>
        <div class="row"><span class="k">${t().kNote}</span><span class="v">${M(w,'note')}</span></div>
        ${M(w,'shift')?`<div class="row"><span class="k">${t().kShift}</span><span class="v">${M(w,'shift')}</span></div>`:''}
        ${w.ex?`<div class="row"><span class="k">${t().kEx}</span><span class="v"><span class="ar" lang="ar">${w.ex.ar}</span><br>${w.ex[LANG]}</span></div>`:''}
      </div>`;
    dock(`<button class="round" id="sa" aria-label="${t().playAr}">${I.play}</button>
          <button class="round text" id="sb" aria-label="${t().playMean}">${t().meanBtn}</button>
          <button class="btn" id="nx">${t().nextWord}</button>`);
    $('sa').onclick=()=>play(w,'ar',karaoke('pr')); $('sb').onclick=()=>play(w,'mean'); $('nx').onclick=next;
    setTimeout(()=>{ if(S&&S.steps[S.i]===st) play(w,'ar',karaoke('pr')); },1150);
  };
}

function opts(w){ const p=new Set(w.near.filter(a=>a!==w.ar)); shuffle(WORDS).forEach(x=>{ if(p.size<3&&x.ar!==w.ar) p.add(x.ar); }); return shuffle([w.ar,...[...p].slice(0,3)]); }
function verdict(w, ok, picked){
  const o = picked && !ok ? ALL.find(x=>x.ar===picked) : null;
  sheet(true, `
    <div class="verdict ${ok?'ok':'no'}">${ok?I.ok+t().right:I.no+t().wrong}</div>
    <div class="line">${pron(w,'fp')}<span class="ar" lang="ar">${w.ar}</span></div>
    <div class="say">${t().means(w.bn, M(w,'mean'))}${o?t().picked(o.bn):t().later}</div>
    <div class="dock"><button class="round" id="sa" aria-label="${t().replay}">${I.play}</button><button class="btn" id="nx">${t().cont}</button></div>`);
  $('sa').onclick=()=>play(w,'ar',karaoke('fp')); $('nx').onclick=next;
  play(w,'ar',karaoke('fp'));
}
function retry(id){ const k=S.steps.findIndex((s,j)=>j>S.i&&(s.t==='match'||s.t==='end')); S.steps.splice(k+1,0,{t:'pick',id,retry:true}); S.first.delete(id); }

function pick(st){
  const w=BY[st.id];
  $('stage').innerHTML=`<p class="eyebrow in">${st.retry?t().again:t().which}</p><div class="hero-bn in">${w.bn}</div>
    <div class="grid in" style="animation-delay:.06s" id="opts">${opts(w).map(a=>`<button class="opt" data-a="${a}" lang="ar">${a}</button>`).join('')}</div>`;
  dock(''); let done=false;
  document.querySelectorAll('#opts .opt').forEach(b=>b.onclick=()=>{ if(done) return; done=true;
    const ok=b.dataset.a===w.ar;
    document.querySelectorAll('#opts .opt').forEach(x=>{ if(x.dataset.a===w.ar) x.classList.add('right'); else if(x!==b) x.classList.add('dim'); });
    if(ok) tap(12); else { b.classList.add('wrong'); tap([25,40,25]); retry(w.id); }
    verdict(w,ok,b.dataset.a); });
}

function match(st){
  const ws=st.ids.map(id=>BY[id]), Lw=shuffle(ws), R=shuffle(ws);
  $('stage').innerHTML=`<p class="eyebrow in">${t().match}</p><p class="body in">${t().matchBody}</p>
    <div class="grid in" style="animation-delay:.06s" id="m">${Lw.map((w,k)=>`<button class="opt bn" data-s="L" data-id="${w.id}">${w.bn}</button><button class="opt" data-s="R" data-id="${R[k].id}" lang="ar">${R[k].ar}</button>`).join('')}</div>`;
  dock(`<button class="btn" id="nx" disabled>${t().left(num(ws.length))}</button>`);
  let sel={L:null,R:null}, left=ws.length;
  document.querySelectorAll('#m .opt').forEach(b=>b.onclick=()=>{ if(b.classList.contains('gone')) return;
    const s=b.dataset.s; if(s==='R') play(BY[b.dataset.id],'ar');
    if(sel[s]) sel[s].classList.remove('sel'); sel[s]=b; b.classList.add('sel');
    if(sel.L&&sel.R){ const a=sel.L,c=sel.R; sel={L:null,R:null};
      if(a.dataset.id===c.dataset.id){ [a,c].forEach(x=>{x.classList.remove('sel');x.classList.add('right');}); tap(10);
        setTimeout(()=>[a,c].forEach(x=>x.classList.add('gone')),380); left--;
        const nx=$('nx'); if(left) nx.textContent=t().left(num(left)); else { nx.disabled=false; nx.textContent=t().cont; nx.onclick=next; }
      } else { [a,c].forEach(x=>{x.classList.remove('sel');x.classList.add('wrong');setTimeout(()=>x.classList.remove('wrong'),360);}); tap([25,40,25]); S.first.delete(a.dataset.id); } } });
}

function listen(st){
  const w=BY[st.id];
  $('stage').innerHTML=`<p class="eyebrow in">${t().listen}</p><button class="orb in" id="orb" aria-label="${t().playWord}">${I.big}</button>
    <p class="body in">${t().listenBody}</p>
    <div class="grid in" style="animation-delay:.06s" id="opts">${shuffle(st.ids).map(id=>`<button class="opt bn" data-id="${id}">${BY[id].bn}</button>`).join('')}</div>`;
  dock('');
  const orb=$('orb'), say=()=>{ orb.classList.add('playing'); play(w,'ar',p=>{ if(p>=1) orb.classList.remove('playing'); }); setTimeout(()=>orb.classList.remove('playing'),2500); };
  orb.onclick=say; setTimeout(()=>{ if(S&&S.steps[S.i]===st) say(); },450);
  let done=false;
  document.querySelectorAll('#opts .opt').forEach(b=>b.onclick=()=>{ if(done) return; done=true; const ok=b.dataset.id===w.id;
    document.querySelectorAll('#opts .opt').forEach(x=>{ if(x.dataset.id===w.id) x.classList.add('right'); else if(x!==b) x.classList.add('dim'); });
    if(ok) tap(12); else { b.classList.add('wrong'); tap([25,40,25]); S.first.delete(w.id); }
    verdict(w,ok,null); });
}

function end(){
  store.set('setu-done-'+L.id,'1');
  const i=LESSONS.indexOf(L), nx=LESSONS[i+1];
  $('stage').style.justifyContent='flex-start';
  $('stage').innerHTML=`<p class="eyebrow in" style="margin-top:12px">${t().finished(num(L.n))}</p><div class="big in" id="cnt">${num(0)}</div>
    <p class="body in">${t().yours(num(S.first.size))}</p>
    <div class="group list in" style="animation-delay:.1s">${WORDS.map(w=>`<div class="row">
      <span class="v"><strong>${w.bn}</strong><small>${pronPlain(w)} · ${M(w,'mean')}</small></span>
      <span class="ar" lang="ar">${w.ar}</span><button class="mini" data-id="${w.id}" aria-label="${t().listenTo(w.bn)}">${I.play}</button></div>`).join('')}</div>`;
  document.querySelectorAll('.list .mini').forEach(b=>b.onclick=()=>play(BY[b.dataset.id],'ar'));
  dock(`<button class="round text" id="again">${t().redo}</button><button class="btn" id="fwd">${nx?t().nextLesson:t().allLessons}</button>`);
  $('again').onclick=()=>open(i,false); $('fwd').onclick=()=> nx ? open(i+1,true) : home();
  let n=0; const el=$('cnt'); const iv=setInterval(()=>{ el.textContent=num(++n); if(n>=WORDS.length){ clearInterval(iv); tap([15,30,15]); } },70);
}

$('restart').onclick=home;
home();
</script>
