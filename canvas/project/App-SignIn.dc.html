<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<title>Setu sign in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;500;600&amp;family=Noto+Sans+Bengali:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
.ar{font-family:'Noto Naskh Arabic','Geeza Pro',serif;direction:rtl;font-weight:500}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: #F5F5F7; font-family: 'Noto Sans Bengali', -apple-system, system-ui, sans-serif; color: #1D1D1F; padding: 20px 24px 36px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; justify-content: flex-end">
<div role="group" aria-label="App language" style="display: flex; background: #E5E5EA; border-radius: 10px; padding: 3px; gap: 2px">
<button type="button" onClick="{{setBn}}" aria-pressed="{{isBn}}" style="min-height: 38px; min-width: 58px; border: 0; border-radius: 8px; font-size: 14px; font-weight: 600; background: {{bnBg}}; color: {{bnInk}}; box-shadow: {{bnSh}}">বাংলা</button>
<button type="button" onClick="{{setEn}}" aria-pressed="{{isEn}}" style="min-height: 38px; min-width: 58px; border: 0; border-radius: 8px; font-size: 14px; font-weight: 600; background: {{enBg}}; color: {{enInk}}; box-shadow: {{enSh}}">English</button>
</div>
</div>
<div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-align: center">
<span class="ar" style="font-size: 64px; line-height: 1.5; color: #0B7A55">جِسْر</span>
<span style="font-size: 15px; font-weight: 600"><span>জিস</span><span style="color: #A1A1A6; font-weight: 400"> · </span><span>র</span></span>
<span style="font-size: 34px; font-weight: 700; letter-spacing: -0.01em; margin-top: 18px">{{t.app}}</span>
<span style="font-size: 17px; color: #6E6E73; max-width: 290px; line-height: 1.5">{{t.tag}}</span>
</div>
<div style="background: #FFFFFF; border-radius: 18px; box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06); padding: 18px; display: flex; flex-direction: column; gap: 12px">
<button type="button" style="min-height: 52px; border-radius: 14px; border: 1px solid rgba(60,60,67,.18); background: #FFFFFF; color: #1D1D1F; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px"><svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>{{t.google}}</button>
<span style="font-size: 13px; color: #6E6E73; text-align: center; line-height: 1.5">{{t.private}}</span>
</div>
<span style="font-size: 12px; color: #A1A1A6; text-align: center">{{t.credit}}</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const lang = (this.state && this.state.lang) || 'bn';
const bn = lang === 'bn';
const T = {
bn: { app: 'সেতু', tag: 'যে আরবি আপনি আগেই জানেন, সেখান থেকে শুরু।', google: 'Google দিয়ে ঢুকুন', private: 'ব্যক্তিগত অ্যাপ। শুধু দুটি অ্যাকাউন্ট ঢুকতে পারে, অগ্রগতি দুই ফোন আর ওয়েবে মিলে থাকে।', credit: 'আওয়াজ: elevenlabs.io' },
en: { app: 'Setu', tag: 'Start from the Arabic you already know.', google: 'Continue with Google', private: 'A private app. Only two accounts can sign in, and progress stays in step across both phones and the web.', credit: 'Voices: elevenlabs.io' }
};
const on = { bg: '#FFFFFF', ink: '#1D1D1F', sh: '0 1px 3px rgba(0,0,0,.12)' };
const off = { bg: 'transparent', ink: '#6E6E73', sh: 'none' };
const a = bn ? on : off, b = bn ? off : on;
return { t: T[lang], isBn: bn, isEn: !bn, bnBg: a.bg, bnInk: a.ink, bnSh: a.sh, enBg: b.bg, enInk: b.ink, enSh: b.sh,
setBn: () => this.setState({ lang: 'bn' }), setEn: () => this.setState({ lang: 'en' }) };
}
}
</script>
</body>
</html>
